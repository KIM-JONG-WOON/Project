<title>보고서 검토 화면</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 가운데 큰 종이 한 장, 양옆에 이전·다음 쪽을 아주 작게. 첫 화면과 같은 크림·코랄 테마 */
:root{
  --bg:#faf9f5; --surface:#ffffff; --ink:#1f1e1d; --muted:#6f6d66; --line:#e6e3da;
  --accent:#d97757; --accent-soft:#f6e4da; --accent-ink:#ffffff;
  --req-bg:#fbd3cc; --req-edge:#c63a2b; --hover:#f3f0e8; --panel:#faf7f2;
  --f-doc:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302e; --ink:#f2f0ea; --muted:#a8a59c; --line:#3e3d39;
  --accent:#e08a6d; --accent-soft:#4a3329; --accent-ink:#1f1e1d;
  --req-bg:#5e2822; --req-edge:#ff8f80; --hover:#3a3936; --panel:#2a2a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302e; --ink:#f2f0ea; --muted:#a8a59c; --line:#3e3d39;
  --accent:#e08a6d; --accent-soft:#4a3329; --accent-ink:#1f1e1d;
  --req-bg:#5e2822; --req-edge:#ff8f80; --hover:#3a3936; --panel:#2a2a28; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:1000px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted)}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.doc-t{flex:1;min-width:0;font-family:var(--f-doc);font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.pill b{color:var(--req-edge);font-weight:600}

/* 무대: 이전 · 현재 · 다음 */
.stage{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr minmax(0,620px) 1fr;gap:28px;align-items:start;padding-top:12px}
.slot{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
.slot.prev{justify-self:end}
.slot.next{justify-self:start}
.thumb{all:unset;box-sizing:border-box;display:grid;gap:6px;justify-items:center;cursor:pointer;width:var(--tw);color:var(--muted);font-size:11.5px}
.thumb-paper{width:var(--tw);height:calc(var(--tw) * 1.414);overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 2px rgba(40,30,20,.05),0 4px 14px rgba(40,30,20,.07);opacity:.75;transition:opacity .15s,transform .15s}
.thumb:hover .thumb-paper,.thumb:focus-visible .thumb-paper{opacity:1;transform:translateY(-2px)}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.thumb-inner{width:620px;transform:scale(var(--ts));transform-origin:0 0;pointer-events:none}
.stage{--tw:104px;--ts:.16774}
.main{min-width:0;container-type:inline-size}

/* 종이 */
.paper{word-break:keep-all;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:4px;aspect-ratio:1/1.414;position:relative;
  box-shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.08);
  padding:9% 9% 11%;font-family:var(--f-doc);font-size:15px;line-height:1.85;user-select:none;-webkit-user-select:none}
@container (max-width:520px){.paper{font-size:13.5px;line-height:1.8;padding:9% 7% 12%}}
.paper textarea{user-select:text;-webkit-user-select:text}
.thumb-inner .paper{font-size:15px;padding:56px 56px 68px}
.enter-next{animation:inR .22s ease-out}
.enter-prev{animation:inL .22s ease-out}
@keyframes inR{from{transform:translateX(18px);opacity:.4}}
@keyframes inL{from{transform:translateX(-18px);opacity:.4}}
.d-title{font-size:1.5em;font-weight:700;line-height:1.4;margin:0 0 .3em;text-wrap:balance}
.d-meta{font-family:var(--f-ui);font-size:.82em;color:var(--muted);margin:0 0 1.8em;padding-bottom:.9em;border-bottom:1px solid var(--line)}
.d-h{font-size:1.1em;font-weight:700;margin:1.5em 0 .4em}
.d-p{margin:0 0 .7em}
.d-ul{margin:0 0 .7em;padding-left:1.2em}
.d-ul li{margin:0}
.d-tbl{overflow-x:auto;margin:.6em 0 .9em}
.d-tbl table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:.82em;line-height:1.5;font-variant-numeric:tabular-nums}
.d-tbl th,.d-tbl td{border:1px solid var(--line);padding:.4em .6em;text-align:right}
.d-tbl th:first-child,.d-tbl td:first-child{text-align:left}
.d-tbl thead td{background:var(--panel);font-weight:600}
.pno{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;font-family:var(--f-ui);font-size:.75em;color:var(--muted)}

/* 문장 단위 */
.u{cursor:pointer;border-radius:3px;padding:.1em .05em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .12s}
.u:hover{background:var(--hover)}
.u[data-st="req"]{background:var(--req-bg);box-shadow:inset 0 -2px 0 var(--req-edge)}

.u.line{display:block}
#paper .d-p,#paper .d-ul li,#paper .d-tbl td,#paper .d-h,#paper .d-h3,#paper .d-title,#paper .d-meta,#paper .d-toc,#paper .d-lines{cursor:pointer}
.d-h3{font-size:1em;font-weight:600;margin:1.1em 0 .3em}
.d-toc,.d-lines{margin:.3em 0 1em}
.d-toc .u{padding:.2em .3em;border-bottom:1px dotted var(--line)}
.d-lines .u{padding:.1em .3em}
.sample{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.sample button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px}
.sample button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
/* 주석창 */
.ann{display:grid;gap:6px;margin:.5em 0 1em;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--req-edge);border-radius:0 8px 8px 0;font-family:var(--f-ui);font-size:13px;line-height:1.5;user-select:text;-webkit-user-select:text;text-align:left}
.ann-h{display:flex;gap:8px;align-items:baseline}
.ann-h b{color:var(--req-edge);font-weight:600}
.ann-h span{color:var(--muted);font-size:12px}
.ann textarea{width:100%;min-height:2.8em;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px;resize:vertical;line-height:1.5}
.ann textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ann textarea.need{border-color:var(--req-edge);box-shadow:0 0 0 3px var(--req-bg)}
.ann-f{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between}
.hint{font-size:11.5px;color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ink)}

/* 아래 */
.foot{max-width:620px;margin:16px auto 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dot[aria-current="true"]{background:var(--accent);width:20px;border-radius:4px}
.foot .hint{width:100%;text-align:center}
.export{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:9px 18px;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}

/* 폰: 오른쪽에 아주 작은 쪽 하나만 */
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr) var(--tw);gap:10px;--tw:48px;--ts:.07742}
  .slot.prev{display:none}
  .slot.prev.solo{display:block;grid-column:2;grid-row:1}
  .slot.next{grid-column:2;grid-row:1}
  .main{grid-column:1;grid-row:1}
  .thumb{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <button class="back" id="back" aria-label="첫 화면으로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="doc-t" id="docT"></div>
  <span class="pill" id="reqCount"></span>
</header>

<section class="stage" id="stage">
  <div class="slot prev" id="prevSlot"></div>
  <div class="main"><article class="paper" id="paper"></article></div>
  <div class="slot next" id="nextSlot"></div>
</section>

<footer class="foot">
  <div class="dots" id="dots"></div>
  <button class="export" id="export" hidden>파일 내보내기</button>
  <span class="hint">문장을 누르면 빨강으로 바뀌고 주석창이 열립니다 · ← → 키나 옆의 작은 쪽을 눌러 넘깁니다</span>
  <div class="sample" role="group" aria-label="예시 문서 분량"><span>예시 문서</span><button data-sample="2">2쪽</button><button data-sample="10">10쪽</button></div>
</footer>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TITLE='[예시] 2026년 3분기 사내 문서 디지털화 추진 현황 보고';
const META='2026.10.20 · 경영지원본부 문서혁신TF';
const DEPTS=[['부서','대상(건)','전환(건)','전환율'],['총무팀','32,000','26,400','82.5%'],['인사팀','18,000','14,200','78.9%'],['재무팀','41,000','23,800','58.0%'],['영업팀','29,000','13,600','46.9%']];
/* 예시 보고서. 숫자는 설명용으로 만든 값
   블록 종류: title·meta·h·h3·toc·lines는 줄 단위, p·ul은 문장 단위, table은 칸 단위 */
const SAMPLES={
2:[
  [
    {t:'title',s:[TITLE]},{t:'meta',s:[META]},
    {t:'h',s:['1. 개요']},
    {t:'p',s:['본 보고서는 2026년 3분기 사내 문서 디지털화 사업의 추진 현황을 정리한 것이다.','사업은 종이 결재 문서를 전자 문서로 바꾸고 보관 비용을 줄이는 것을 목표로 한다.','보고 기준일은 2026.10.20이다.']},
    {t:'h',s:['2. 추진 현황']},
    {t:'p',s:['3분기까지 전체 대상 문서 12만 건 가운데 7만 8천 건을 전자 문서로 전환했다.','전환율은 65.0%로 계획 대비 3.5%p 앞서 있다.','부서별로는 총무팀과 인사팀의 전환 속도가 가장 빨랐다.']},
    {t:'table',rows:DEPTS},
    {t:'ul',s:['스캔 장비 4대를 추가로 도입했다.','부서별 담당자 교육을 두 차례 진행했다.','전자 결재 사용률은 81%까지 올랐다.']}
  ],[
    {t:'h',s:['3. 문제점']},
    {t:'p',s:['오래된 문서는 글자가 흐려 자동 인식 정확도가 낮다.','일부 부서는 여전히 종이 결재를 선호한다.','이 때문에 같은 문서가 종이와 전자로 이중 보관되는 사례가 생기고 있다.']},
    {t:'h',s:['4. 개선 방안']},
    {t:'p',s:['인식 정확도가 낮은 문서는 수작업 검수 단계를 따로 둔다.','종이 결재를 선호하는 부서에는 전자 결재의 장점을 보여 주는 사례 중심 교육을 추가한다.','이중 보관 문서는 분기마다 점검해 한쪽을 정리한다.']},
    {t:'h',s:['5. 향후 계획']},
    {t:'p',s:['4분기에는 남은 4만 2천 건의 전환을 마치는 것이 목표다.','연말까지 전환율 100%를 달성하면 내년 보관 비용은 약 30% 줄어들 것으로 본다.','다음 보고는 2027년 1월에 한다.']},
    {t:'lines',s:['붙임 1. 부서별 전환 일정표 1부']}
  ]
],
10:[
  [
    {t:'title',s:[TITLE]},{t:'meta',s:[META]},
    {t:'h',s:['요약']},
    {t:'ul',s:['3분기 말 기준 전체 대상 문서 12만 건 가운데 7만 8천 건을 전환해 전환율 65.0%를 기록했다.','계획 대비 3.5%p 앞서 있으며, 문서 보관 비용은 전년 같은 기간보다 18% 줄었다.','오래된 문서의 인식 정확도와 일부 부서의 종이 결재 선호가 남은 과제다.','4분기에 남은 4만 2천 건을 전환해 연말 전환율 100%를 달성할 계획이다.']},
    {t:'h',s:['목차']},
    {t:'toc',s:['1. 개요','2. 추진 경과','3. 추진 현황','4. 성과 분석','5. 문제점','6. 개선 방안','7. 향후 계획','8. 소요 예산','9. 결론 및 건의','붙임']}
  ],[
    {t:'h',s:['1. 개요']},
    {t:'h3',s:['1-1. 추진 배경']},
    {t:'p',s:['사내 결재 문서의 약 70%가 아직 종이로 만들어지고 보관된다.','문서 보관 창고 임차료와 관리 인력 비용은 해마다 늘고 있다.','종이 문서는 검색이 어려워 업무 처리 시간도 길어진다.']},
    {t:'h3',s:['1-2. 목적']},
    {t:'p',s:['종이 결재 문서를 전자 문서로 바꿔 보관 비용을 줄인다.','문서를 쉽게 찾을 수 있게 해 업무 처리 시간을 줄인다.','전자 결재를 기본 업무 방식으로 자리 잡게 한다.']},
    {t:'h3',s:['1-3. 범위']},
    {t:'p',s:['대상은 2016년부터 2025년까지 만들어진 결재 문서 12만 건이다.','법적 보존 의무가 있는 원본은 전환 후에도 따로 보관한다.','대상 부서는 총무팀, 인사팀, 재무팀, 영업팀 4개 부서다.']}
  ],[
    {t:'h',s:['2. 추진 경과']},
    {t:'p',s:['사업은 2026년 4월에 시작해 2026년 12월에 마치는 것을 목표로 한다.','4~5월에 준비를 마치고 6월부터 본격적인 전환 작업을 진행했다.']},
    {t:'table',rows:[['기간','주요 내용','상태'],['2026.04','추진 계획 수립, TF 구성','완료'],['2026.05','스캔 장비 도입, 업체 선정','완료'],['2026.06~07','총무팀·인사팀 전환','완료'],['2026.08~09','재무팀·영업팀 전환 시작','진행 중'],['2026.10~12','남은 문서 전환, 검수','예정']]},
    {t:'p',s:['8월에는 장비 고장으로 2주간 작업이 멈췄으나, 9월에 야간 작업을 늘려 일정을 회복했다.','현재 공정은 전체 일정 기준으로 계획보다 약 2주 앞서 있다.']}
  ],[
    {t:'h',s:['3. 추진 현황']},
    {t:'h3',s:['3-1. 전체 실적']},
    {t:'p',s:['3분기까지 전체 대상 문서 12만 건 가운데 7만 8천 건을 전자 문서로 전환했다.','전환율은 65.0%로 계획 대비 3.5%p 앞서 있다.','부서별로는 총무팀과 인사팀의 전환 속도가 가장 빨랐다.']},
    {t:'table',rows:[...DEPTS,['합계','120,000','78,000','65.0%']]},
    {t:'p',s:['재무팀과 영업팀은 문서 양이 많고 형식이 다양해 전환 속도가 상대적으로 느리다.']}
  ],[
    {t:'h3',s:['3-2. 장비와 시스템']},

    {t:'h3',s:['3-3. 교육과 홍보']},

    {t:'table',rows:[['항목','2025년 3분기','2026년 3분기','변화'],['보관 비용(백만 원)','84','69','-18%'],['문서 검색 시간(분)','12','2','-83%'],['전자 결재 사용률','52%','81%','+29%p'],['종이 사용량(만 장)','46','31','-33%']]},

  ],[

    {t:'p',s:['2018년 이전에 만들어진 문서는 글자가 흐려 자동 인식 정확도가 낮다.','이 문서들의 인식 정확도는 평균 71%로, 최근 문서의 96%보다 크게 낮다.','검색되지 않는 문서가 남으면 전환 효과가 줄어든다.']},
    {t:'h3',s:['5-2. 종이 결재 선호']},

    {t:'p',s:['개선 방안은 10월 운영회의에서 확정했으며, 진행 상황은 매월 점검한다.']}
  ],[
    {t:'h',s:['7. 향후 계획']},
    {t:'p',s:['4분기에는 남은 4만 2천 건의 전환을 마치는 것이 목표다.','월 1만 4천 건씩 처리하면 12월 중순에 전환을 마칠 수 있다.']},

    {t:'p',s:['4분기 소요 예산은 1억 2천만 원이다.','항목별로는 검수 인력 6천만 원, 장비 유지보수 3천만 원, 교육과 홍보 1천만 원, 예비비 2천만 원이다.']}
  ],[
    {t:'h',s:['9. 결론 및 건의']},
    {t:'p',s:['사업은 계획보다 빠르게 진행되고 있으며, 비용 절감과 업무 시간 단축 효과도 나타나고 있다.','연말까지 전환을 마치면 내년 문서 보관 비용은 약 30% 줄어들 것으로 본다.','남은 과제를 풀려면 각 부서의 협조가 필요하다.']},
    {t:'h3',s:['건의 사항']},
    {t:'ul',s:['외부 기관에 내는 문서는 전자 제출을 기본으로 하는 지침을 마련해 주기 바란다.','4분기 예산 1억 2천만 원의 집행을 승인해 주기 바란다.']},
    {t:'p',s:['다음 보고는 2027년 1월에 한다.']},

    {t:'lines',s:['붙임 1. 부서별 전환 일정표 1부','붙임 2. 교육 만족도 조사 결과 1부','붙임 3. 4분기 예산 세부 내역 1부']}
  ]
]};
const LINE_TYPES=['title','meta','h','h3','toc','lines'];
let PAGES=[], req=new Map(), page=0, sampleN=2;

function load(n){
  sampleN=n; PAGES=SAMPLES[n]; req=new Map(); page=0;
  PAGES.forEach((pg,pi)=>pg.forEach((b,bi)=>{
    if(b.t==='table')b.ids=b.rows.map((r,ri)=>r.map((_,ci)=>`s${n}p${pi}b${bi}r${ri}c${ci}`));
    else b.ids=b.s.map((_,si)=>`s${n}p${pi}b${bi}s${si}`);
  }));
  document.querySelectorAll('[data-sample]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.sample===n)));
  render();
}
function panel(id){
  return `<span class="ann" data-a="${id}" style="display:grid"><span class="ann-h"><b>요청</b><span>어떻게 고칠지 적어 주세요</span></span>`+
    `<textarea data-c="${id}" rows="2" placeholder="예: 더 짧게, 숫자는 표와 맞춰서">${esc(req.get(id).comment)}</textarea>`+
    `<span class="ann-f"><span class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 이 쪽의 주석이 함께 전송됩니다</span><button class="link" data-x="${id}">요청 취소</button></span></span>`;
}
function unit(id,text,live,line){
  const r=req.has(id);
  return `<span class="u${line?' line':''}" data-u="${id}" data-st="${r?'req':'black'}">${esc(text)}</span>`+(r&&live?panel(id):'');
}
function pageHTML(pi,live){
  const body=PAGES[pi].map(b=>{
    const line=LINE_TYPES.includes(b.t);
    const us=b.s?b.s.map((s,i)=>unit(b.ids[i],s,live,line)).join(line?'':' '):'';
    if(b.t==='title')return `<h1 class="d-title">${us}</h1>`;
    if(b.t==='meta')return `<div class="d-meta">${us}</div>`;
    if(b.t==='h')return `<h2 class="d-h">${us}</h2>`;
    if(b.t==='h3')return `<h3 class="d-h3">${us}</h3>`;
    if(b.t==='toc')return `<div class="d-toc">${us}</div>`;
    if(b.t==='lines')return `<div class="d-lines">${us}</div>`;
    if(b.t==='p')return `<p class="d-p">${us}</p>`;
    if(b.t==='ul')return `<ul class="d-ul">${b.s.map((s,i)=>`<li>${unit(b.ids[i],s,live)}</li>`).join('')}</ul>`;
    if(b.t==='table')return `<div class="d-tbl"><table>${b.rows.map((r,ri)=>`<${ri?'tr':'thead><tr'}>${r.map((c,ci)=>`<td>${unit(b.ids[ri][ci],c,false)}</td>`).join('')}</tr>${ri?'':'</thead>'}`).join('')}</table></div>`+(live?b.ids.flat().filter(id=>req.has(id)).map(panel).join(''):'');
  }).join('');
  return body+`<div class="pno">- ${pi+1} -</div>`;
}
function thumb(pi,label){
  return `<button class="thumb" data-go="${pi}" aria-label="${pi+1}쪽으로 이동"><span class="thumb-paper"><span class="thumb-inner" style="display:block"><span class="paper" style="display:block">${pageHTML(pi,false)}</span></span></span><span>${label}</span></button>`;
}
function render(dir){
  const paper=$('#paper');
  paper.innerHTML=pageHTML(page,true);
  paper.classList.remove('enter-next','enter-prev');
  if(dir){void paper.offsetWidth;paper.classList.add(dir>0?'enter-next':'enter-prev')}
  const n=PAGES.length, hasPrev=page>0, hasNext=page<n-1;
  $('#prevSlot').innerHTML=hasPrev?thumb(page-1,`← ${page}쪽`):'';
  $('#nextSlot').innerHTML=hasNext?thumb(page+1,`${page+2}쪽 →`):'';
  $('#prevSlot').classList.toggle('solo',hasPrev&&!hasNext);
  $('#dots').innerHTML=PAGES.map((_,i)=>`<button class="dot" data-go="${i}" aria-label="${i+1}쪽" aria-current="${i===page}"></button>`).join('');
  $('#export').hidden=hasNext;
  $('#reqCount').innerHTML=`${page+1} / ${n}쪽${req.size?` · <b>빨강 ${req.size}</b>`:''}`;
}
function go(i){if(i<0||i>=PAGES.length||i===page)return;const d=i>page?1:-1;page=i;render(d);scrollTo({top:0,behavior:'smooth'})}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2800)}

/* 클릭 규칙: 글자 위가 아니어도 블록 안을 누르면, 누른 자리에서 가장 가까운 문장(줄)이 선택된다 */
const BLOCKS='.d-p,.d-ul li,.d-tbl td,.d-h,.d-h3,.d-title,.d-meta,.d-toc,.d-lines';
function hit(e){
  const direct=e.target.closest('#paper .u');if(direct)return direct;
  if(!e.target.closest('#paper')||e.target.closest('.ann'))return null;
  const blk=e.target.closest(BLOCKS);if(!blk)return null;
  let best=null,score=Infinity;
  for(const el of blk.querySelectorAll('.u')){
    for(const r of el.getClientRects()){
      const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom),sc=dy*1000+dx;
      if(sc<score){score=sc;best=el}
    }
  }
  return best;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
  const sm=e.target.closest('[data-sample]');if(sm){if(+sm.dataset.sample!==sampleN)load(+sm.dataset.sample);return}
  const x=e.target.closest('[data-x]');if(x){req.delete(x.dataset.x);render();return}
  const u=hit(e);
  if(u){
    const id=u.dataset.u;
    if(req.has(id))req.delete(id);else req.set(id,{comment:''});
    render();
    $(`#paper textarea[data-c="${id}"]`)?.focus({preventScroll:true});
  }
});
document.addEventListener('input',e=>{const c=e.target.dataset?.c;if(c&&req.has(c)){req.get(c).comment=e.target.value;e.target.classList.remove('need')}});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.matches&&t.matches('textarea[data-c]')){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){
      e.preventDefault();
      const here=[...document.querySelectorAll('#paper textarea[data-c]')];
      const empty=here.filter(x=>!x.value.trim());
      if(empty.length){empty.forEach(x=>x.classList.add('need'));empty[0].focus();toast(`주석이 비어 있는 요청이 ${empty.length}개 있어 보내지 않았습니다.`)}
      else toast(`화면 시안입니다. 이 쪽의 주석 ${here.length}개를 Claude에게 보내는 자리입니다.`);
    }
    return;
  }
  if(e.key==='ArrowRight')go(page+1);
  if(e.key==='ArrowLeft')go(page-1);
});
$('#export').onclick=()=>toast(req.size?`빨강 문장이 ${req.size}개 남아 있어 내보낼 수 없습니다.`:'화면 시안입니다. 내보내기는 다음 단계에서 연결합니다.');
$('#back').onclick=()=>toast('화면 시안입니다. 첫 화면으로 돌아가는 자리입니다.');
$('#docT').textContent=TITLE;
load(2);
</script>
