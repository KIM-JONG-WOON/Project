<title>보고서 검토 화면</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 종이를 위아래로 이어 붙이고, 각 종이 왼쪽 위에 색 필름 인덱스(쪽수)를 붙인다. 첫 화면과 같은 크림·코랄 테마 */
:root{
  --bg:#faf9f5; --surface:#ffffff; --ink:#1f1e1d; --muted:#6f6d66; --line:#e6e3da;
  --accent:#d97757; --accent-soft:#f6e4da; --accent-ink:#ffffff;
  --req-bg:#fbd3cc; --req-edge:#d4321f; --hover:#f3f0e8; --panel:#faf7f2; --scrim:rgba(31,30,29,.55);
  /* 필름 인덱스 색 (빨강·초록 계열 제외) */
  --f0:#f3c94f; --f1:#6f9cf0; --f2:#a184e6; --f3:#5cbfe0; --f4:#f0a24e; --f5:#5f6fd6; --f6:#c4a06a;
  --film-ink:#1f1e1d;
  --f-doc:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302e; --ink:#f2f0ea; --muted:#a8a59c; --line:#3e3d39;
  --accent:#e08a6d; --accent-soft:#4a3329; --accent-ink:#1f1e1d;
  --req-bg:#5e2822; --req-edge:#ff6b57; --hover:#3a3936; --panel:#2a2a28; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302e; --ink:#f2f0ea; --muted:#a8a59c; --line:#3e3d39;
  --accent:#e08a6d; --accent-soft:#4a3329; --accent-ink:#1f1e1d;
  --req-bg:#5e2822; --req-edge:#ff6b57; --hover:#3a3936; --panel:#2a2a28; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 바: 뒤로 + 제목만 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:680px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted)}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.doc-t{flex:1;min-width:0;font-family:var(--f-doc);font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 종이 묶음 */
/* 가로로 넘기는 무대: 한 번에 한 쪽, 일정 거리까지는 버티다가 넘으면 다음 쪽으로 넘어감 */
.stage{max-width:680px;margin:0 auto;overflow:hidden;touch-action:pan-y;transition:height .35s ease;position:relative}
.track{display:flex;align-items:flex-start;gap:var(--gap);will-change:transform;--gap:28px}
.slide{flex:0 0 100%;min-width:0;padding:26px 30px 10px;container-type:inline-size}
@media (max-width:520px){.slide{padding:26px 0 10px}}
.stage.dragging{cursor:grabbing}
.paper{word-break:keep-all;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:4px;aspect-ratio:1/1.414;position:relative;max-width:620px;margin:0 auto;
  box-shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.08);
  padding:9% 9% 9%;font-family:var(--f-doc);font-size:15px;line-height:1.85;user-select:none;-webkit-user-select:none}
@container (max-width:520px){.paper{font-size:13.5px;line-height:1.8;padding:10% 7% 9%}}
.paper textarea{user-select:text;-webkit-user-select:text}

/* 필름 인덱스: 종이 왼쪽 위에 반쯤 걸쳐 붙인 반투명 색 필름 */
.film{position:absolute;top:-16px;left:22px;z-index:2;min-width:38px;height:34px;padding:0 10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--fc) 72%,transparent);border:2px solid color-mix(in srgb,var(--fc) 100%,#000 12%);border-radius:3px 3px 2px 2px;
  color:var(--film-ink);font-family:var(--f-ui);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
  transform:rotate(-2.5deg);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .15s}
.film::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:5px;background:rgba(255,255,255,.35);border-radius:2px}
.film:hover{transform:rotate(-2.5deg) translateY(-2px)}
.film[data-red="true"]{border-color:var(--req-edge);border-width:3px}
button.film{cursor:pointer}

.d-title{font-size:1.5em;font-weight:700;line-height:1.4;margin:0 0 .3em;text-wrap:balance}
.d-meta{font-family:var(--f-ui);font-size:.82em;color:var(--muted);margin:0 0 1.8em;padding-bottom:.9em;border-bottom:1px solid var(--line)}
.d-h{font-size:1.1em;font-weight:700;margin:1.5em 0 .4em}
.d-h:first-child{margin-top:0}
.d-h3{font-size:1em;font-weight:600;margin:1.1em 0 .3em}
.d-h3:first-child{margin-top:0}
.d-p{margin:0 0 .7em}
.d-ul{margin:0 0 .7em;padding-left:1.2em}
.d-toc,.d-lines{margin:.3em 0 1em}
.d-toc .u{padding:.2em .3em;border-bottom:1px dotted var(--line)}
.d-lines .u{padding:.1em .3em}
.d-tbl{overflow-x:auto;margin:.6em 0 .9em}
.d-tbl table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:.82em;line-height:1.5;font-variant-numeric:tabular-nums}
.d-tbl td{border:1px solid var(--line);padding:.4em .6em;text-align:right}
.d-tbl td:first-child{text-align:left}
.d-tbl thead td{background:var(--panel);font-weight:600}

/* 문장 단위 */
.u{cursor:pointer;border-radius:3px;padding:.1em .05em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .12s}
.u.line{display:block}
.u:hover{background:var(--hover)}
.u[data-st="req"]{background:var(--req-bg);box-shadow:inset 0 -2px 0 var(--req-edge)}
.track .d-p,.track .d-ul li,.track .d-tbl td,.track .d-h,.track .d-h3,.track .d-title,.track .d-meta,.track .d-toc,.track .d-lines{cursor:pointer}

/* 주석창 */
.ann{display:grid;gap:6px;margin:.5em 0 1em;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--req-edge);border-radius:0 8px 8px 0;font-family:var(--f-ui);font-size:13px;line-height:1.5;user-select:text;-webkit-user-select:text;text-align:left;cursor:auto}
.ann-h{display:flex;gap:8px;align-items:baseline}
.ann-h b{color:var(--req-edge);font-weight:600}
.ann-h span{color:var(--muted);font-size:12px}
.ann textarea{width:100%;min-height:2.8em;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px;resize:vertical;line-height:1.5}
.ann textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ann textarea.need{border-color:var(--req-edge);box-shadow:0 0 0 3px var(--req-bg)}
.ann-f{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between}
.hint{font-size:11.5px;color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ink)}

/* 문서 끝 */
.end{max-width:620px;margin:28px auto 0;display:grid;justify-items:center;gap:14px}
.export{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:10px 22px;font-weight:600;font-size:14px}
.sample{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.sample button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px}
.sample button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/* 전체 쪽 미리보기 */
.ov{position:fixed;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:16px}
.ov-box{background:var(--bg);border-radius:12px;width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 18px 22px;display:grid;gap:14px}
.ov-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ov-h h2{margin:0;font-size:16px}
.ov-close{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.ov-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 16px;padding-top:12px}
@media (max-width:640px){.ov-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cell{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:block;border-radius:4px}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cell[aria-current="true"] .mini{outline:2px solid var(--accent);outline-offset:3px}
.mini{display:block;width:100%;aspect-ratio:1/1.414;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:0 2px 8px rgba(40,30,20,.08);position:relative}
.mini-inner{width:620px;transform:scale(var(--ts,.2));transform-origin:0 0;pointer-events:none}
.mini-inner .paper{box-shadow:none;border:0;aspect-ratio:auto;min-height:877px}
.mini-inner .film{display:none}
.cell .film{top:-12px;left:10px;min-width:30px;height:26px;font-size:12px;padding:0 7px}
.cell:hover .mini{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <button class="back" id="back" aria-label="첫 화면으로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="doc-t" id="docT"></div>
</header>

<main class="stage" id="stage"><div class="track" id="doc"></div></main>

<div class="end">
  <button class="export" id="export">파일 내보내기</button>
  <div class="sample" role="group" aria-label="예시 문서 분량"><span>예시 문서</span><button data-sample="2">2쪽</button><button data-sample="10">10쪽</button></div>
</div>

<div class="ov" id="ov" hidden>
  <div class="ov-box" role="dialog" aria-modal="true" aria-labelledby="ovT">
    <div class="ov-h"><h2 id="ovT">전체 쪽</h2><button class="ov-close" id="ovClose">닫기</button></div>
    <div class="ov-grid" id="ovGrid"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TITLE='[예시] 2026년 3분기 사내 문서 디지털화 추진 현황 보고';

/* 예시 보고서. 숫자는 설명용으로 만든 값
   블록 종류: title·meta·h·h3·toc·lines는 줄 단위, p·ul은 문장 단위, table은 칸 단위 */

2:[

    {t:'p',s:['본 보고서는 2026년 3분기 사내 문서 디지털화 사업의 추진 현황을 정리한 것이다.','사업은 종이 결재 문서를 전자 문서로 바꾸고 보관 비용을 줄이는 것을 목표로 한다.','보고 기준일은 2026.10.20이다.']},
    {t:'h',s:['2. 추진 현황']},
    {t:'p',s:['3분기까지 전체 대상 문서 12만 건 가운데 7만 8천 건을 전자 문서로 전환했다.','전환율은 65.0%로 계획 대비 3.5%p 앞서 있다.','부서별로는 총무팀과 인사팀의 전환 속도가 가장 빨랐다.']},
    {t:'table',rows:DEPTS},
    {t:'ul',s:['스캔 장비 4대를 추가로 도입했다.','부서별 담당자 교육을 두 차례 진행했다.','전자 결재 사용률은 81%까지 올랐다.']}
  ],[
    {t:'h',s:['3. 문제점']},
    {t:'p',s:['오래된 문서는 글자가 흐려 자동 인식 정확도가 낮다.','일부 부서는 여전히 종이 결재를 선호한다.','이 때문에 같은 문서가 종이와 전자로 이중 보관되는 사례가 생기고 있다.']},
    {t:'h',s:['4. 개선 방안']},
    {t:'p',s:['인식 정확도가 낮은 문서는 수작업 검수 단계를 따로 둔다.','종이 결재를 선호하는 부서에는 전자 결재의 장점을 보여 주는 사례 중심 교육을 추가한다.','이중 보관 문서는 분기마다 점검해 한쪽을 정리한다.']},
    {t:'h',s:['5. 향후 계획']},

    {t:'lines',s:['붙임 1. 부서별 전환 일정표 1부']}
  ]
],
10:[
  [
    {t:'title',s:[TITLE]},{t:'meta',s:[META]},

    {t:'ul',s:['3분기 말 기준 전체 대상 문서 12만 건 가운데 7만 8천 건을 전환해 전환율 65.0%를 기록했다.','계획 대비 3.5%p 앞서 있으며, 문서 보관 비용은 전년 같은 기간보다 18% 줄었다.','오래된 문서의 인식 정확도와 일부 부서의 종이 결재 선호가 남은 과제다.','4분기에 남은 4만 2천 건을 전환해 연말 전환율 100%를 달성할 계획이다.']},
    {t:'h',s:['목차']},
    {t:'toc',s:['1. 개요','2. 추진 경과','3. 추진 현황','4. 성과 분석','5. 문제점','6. 개선 방안','7. 향후 계획','8. 소요 예산','9. 결론 및 건의','붙임']}
  ],[
    {t:'h',s:['1. 개요']},
    {t:'h3',s:['1-1. 추진 배경']},
    {t:'p',s:['사내 결재 문서의 약 70%가 아직 종이로 만들어지고 보관된다.','문서 보관 창고 임차료와 관리 인력 비용은 해마다 늘고 있다.','종이 문서는 검색이 어려워 업무 처리 시간도 길어진다.']},

  ],[

    {t:'table',rows:[['기간','주요 내용','상태'],['2026.04','추진 계획 수립, TF 구성','완료'],['2026.05','스캔 장비 도입, 업체 선정','완료'],['2026.06~07','총무팀·인사팀 전환','완료'],['2026.08~09','재무팀·영업팀 전환 시작','진행 중'],['2026.10~12','남은 문서 전환, 검수','예정']]},

  ],[

    {t:'p',s:['비용 절감 효과는 창고 임차 면적을 줄이는 4분기부터 더 커질 것으로 본다.']}
  ],[

    {t:'h3',s:['5-1. 오래된 문서의 인식 정확도']},
    {t:'p',s:['2018년 이전에 만들어진 문서는 글자가 흐려 자동 인식 정확도가 낮다.','이 문서들의 인식 정확도는 평균 71%로, 최근 문서의 96%보다 크게 낮다.','검색되지 않는 문서가 남으면 전환 효과가 줄어든다.']},

    {t:'p',s:['개선 방안은 10월 운영회의에서 확정했으며, 진행 상황은 매월 점검한다.']}
  ],[
    {t:'h',s:['7. 향후 계획']},
    {t:'p',s:['4분기에는 남은 4만 2천 건의 전환을 마치는 것이 목표다.','월 1만 4천 건씩 처리하면 12월 중순에 전환을 마칠 수 있다.']},
    {t:'table',rows:[['월','전환 목표(건)','누적 전환율'],['10월','14,000','76.7%'],['11월','14,000','88.3%'],['12월','14,000','100.0%']]},
    {t:'h',s:['8. 소요 예산']},
    {t:'p',s:['4분기 소요 예산은 1억 2천만 원이다.','항목별로는 검수 인력 6천만 원, 장비 유지보수 3천만 원, 교육과 홍보 1천만 원, 예비비 2천만 원이다.']}
  ],[
    {t:'h',s:['9. 결론 및 건의']},
    {t:'p',s:['사업은 계획보다 빠르게 진행되고 있으며, 비용 절감과 업무 시간 단축 효과도 나타나고 있다.','연말까지 전환을 마치면 내년 문서 보관 비용은 약 30% 줄어들 것으로 본다.','남은 과제를 풀려면 각 부서의 협조가 필요하다.']},
    {t:'h3',s:['건의 사항']},
    {t:'ul',s:['외부 기관에 내는 문서는 전자 제출을 기본으로 하는 지침을 마련해 주기 바란다.','4분기 예산 1억 2천만 원의 집행을 승인해 주기 바란다.']},
    {t:'p',s:['다음 보고는 2027년 1월에 한다.']},
    {t:'h',s:['붙임']},
    {t:'lines',s:['붙임 1. 부서별 전환 일정표 1부','붙임 2. 교육 만족도 조사 결과 1부','붙임 3. 4분기 예산 세부 내역 1부']}
  ]
]};
const LINE_TYPES=['title','meta','h','h3','toc','lines'], FILM_N=7;
let PAGES=[], req=new Map(), sampleN=2, films=[];

/* 필름 색: 처음 열 때 쪽마다 무작위로 정하고, 이후에는 바꾸지 않는다 */
function filmColors(n,count){
  const key=`rv-film-${n}`;
  try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v)&&v.length===count)return v}catch(e){}
  const v=[];for(let i=0;i<count;i++){let c;do{c=Math.floor(Math.random()*FILM_N)}while(i&&c===v[i-1]);v.push(c)}
  try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}
  return v;
}
function load(n){
  sampleN=n; PAGES=SAMPLES[n]; req=new Map(); cur=0; films=filmColors(n,PAGES.length);
  PAGES.forEach((pg,pi)=>pg.forEach((b,bi)=>{
    if(b.t==='table')b.ids=b.rows.map((r,ri)=>r.map((_,ci)=>`s${n}p${pi}b${bi}r${ri}c${ci}`));
    else b.ids=b.s.map((_,si)=>`s${n}p${pi}b${bi}s${si}`);
  }));
  document.querySelectorAll('[data-sample]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.sample===n)));
  render();scrollTo({top:0,behavior:'auto'});
}
function pageIds(pi){return PAGES[pi].flatMap(b=>b.t==='table'?b.ids.flat():b.ids)}
const pageRed=pi=>pageIds(pi).some(id=>req.has(id));
function film(pi,tag){return `<${tag} class="film" ${tag==='button'?'data-ov="1" aria-label="'+(pi+1)+'쪽 · 전체 쪽 보기"':''} style="--fc:var(--f${films[pi]})" data-red="${pageRed(pi)}">${pi+1}</${tag}>`}
function panel(id){
  return `<span class="ann" data-a="${id}" style="display:grid"><span class="ann-h"><b>요청</b><span>어떻게 고칠지 적어 주세요</span></span>`+
    `<textarea data-c="${id}" rows="2" placeholder="예: 더 짧게, 숫자는 표와 맞춰서">${esc(req.get(id).comment)}</textarea>`+
    `<span class="ann-f"><span class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 이 쪽의 주석이 함께 전송됩니다</span><button class="link" data-x="${id}">요청 취소</button></span></span>`;
}
function unit(id,text,live,line){
  const r=req.has(id);
  return `<span class="u${line?' line':''}" data-u="${id}" data-st="${r?'req':'black'}">${esc(text)}</span>`+(r&&live?panel(id):'');
}
function pageBody(pi,live){
  return PAGES[pi].map(b=>{
    const line=LINE_TYPES.includes(b.t);
    const us=b.s?b.s.map((s,i)=>unit(b.ids[i],s,live,line)).join(line?'':' '):'';
    if(b.t==='title')return `<h1 class="d-title">${us}</h1>`;
    if(b.t==='meta')return `<div class="d-meta">${us}</div>`;
    if(b.t==='h')return `<h2 class="d-h">${us}</h2>`;
    if(b.t==='h3')return `<h3 class="d-h3">${us}</h3>`;
    if(b.t==='toc')return `<div class="d-toc">${us}</div>`;
    if(b.t==='lines')return `<div class="d-lines">${us}</div>`;
    if(b.t==='p')return `<p class="d-p">${us}</p>`;
    if(b.t==='ul')return `<ul class="d-ul">${b.s.map((s,i)=>`<li>${unit(b.ids[i],s,live)}</li>`).join('')}</ul>`;
    if(b.t==='table')return `<div class="d-tbl"><table>${b.rows.map((r,ri)=>`<${ri?'tr':'thead><tr'}>${r.map((c,ci)=>`<td>${unit(b.ids[ri][ci],c,false)}</td>`).join('')}</tr>${ri?'':'</thead>'}`).join('')}</table></div>`+(live?b.ids.flat().filter(id=>req.has(id)).map(panel).join(''):'');
  }).join('');
}
function render(focusId){
  $('#doc').innerHTML=PAGES.map((_,pi)=>`<section class="slide" data-s="${pi}"><article class="paper" data-p="${pi}">${film(pi,'button')}${pageBody(pi,true)}</article></section>`).join('');
  cur=Math.min(cur,PAGES.length-1);
  markActive();setX(base());fitHeight();
  slides().forEach(sl=>ro.observe(sl));
  if(focusId)$(`#doc textarea[data-c="${focusId}"]`)?.focus({preventScroll:true});
}

/* ---- 가로 넘김: 일정 거리까지는 버티다가, 넘으면 바로 다음 쪽으로 ---- */
let cur=0;
const stage=$('#stage'), track=$('#doc');
const GAP=()=>parseFloat(getComputedStyle(track).columnGap)||28;
const W=()=>stage.clientWidth;
const base=()=>-cur*(W()+GAP());
const THRESH=()=>Math.min(150,W()*0.22);
const EASE_GO='.42s cubic-bezier(.2,1.1,.3,1)';
const EASE_BACK='.55s cubic-bezier(.25,1.6,.45,1)';
function setX(x,anim){track.style.transition=anim?`transform ${anim}`:'none';track.style.transform=`translate3d(${x}px,0,0)`}
function slides(){return [...track.querySelectorAll('.slide')]}
function markActive(){slides().forEach((sl,i)=>{const on=i===cur;sl.inert=!on;sl.setAttribute('aria-hidden',String(!on))})}
function fitHeight(){const sl=slides()[cur];if(sl)stage.style.height=sl.offsetHeight+'px'}
const ro=new ResizeObserver(()=>fitHeight());
function atEdge(dx){return (dx>0&&cur===0)||(dx<0&&cur===PAGES.length-1)}
function resist(dx){return dx*(atEdge(dx)?0.12:0.32)}
function go(i,anim){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  if(i===cur){setX(base(),EASE_BACK);return}
  cur=i;markActive();setX(base(),anim||EASE_GO);fitHeight();
  const top=stage.getBoundingClientRect().top+scrollY-70;if(scrollY>top)scrollTo({top,behavior:'smooth'});
}
stage.addEventListener('scroll',()=>{stage.scrollLeft=0});
addEventListener('resize',()=>{setX(base());fitHeight()});

/* 손가락·마우스로 밀기 */
let drag=null, suppress=false;
stage.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('textarea,button,.ann'))return;
  const now=performance.now();
  drag={x:e.clientX,y:e.clientY,on:false,done:false,id:e.pointerId,lx:e.clientX,lt:now,vx:0};
});
stage.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){drag=null;return}
    if(Math.abs(dx)<8)return;
    drag.on=true;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');
  }
  const now=performance.now();drag.vx=(e.clientX-drag.lx)/Math.max(1,now-drag.lt);drag.lx=e.clientX;drag.lt=now;
  if(drag.done)return;
  if(!atEdge(dx)&&Math.abs(dx)>THRESH()){drag.done=true;go(cur+(dx<0?1:-1));return}
  setX(base()+resist(dx));
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;stage.classList.remove('dragging');
  if(!d.on)return;
  suppress=true;setTimeout(()=>suppress=false,0);
  if(d.done)return;
  const dx=e.clientX-d.x;
  if(Math.abs(d.vx)>0.7&&Math.abs(dx)>30&&!atEdge(dx))go(cur+(d.vx<0?1:-1));else setX(base(),EASE_BACK);
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault()}},true);

/* 트랙패드·가로 휠 */
let wdx=0,wTimer=0,wLock=0;
stage.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  e.preventDefault();
  if(performance.now()<wLock)return;
  wdx-=e.deltaX;clearTimeout(wTimer);
  if(!atEdge(wdx)&&Math.abs(wdx)>THRESH()){const dir=wdx<0?1:-1;wdx=0;wLock=performance.now()+650;go(cur+dir);return}
  setX(base()+resist(wdx));
  wTimer=setTimeout(()=>{wdx=0;setX(base(),EASE_BACK)},140);
},{passive:false});

/* 전체 쪽 미리보기 */
function openOverview(){
  $('#ovGrid').innerHTML=PAGES.map((_,pi)=>`<button class="cell" data-goto="${pi}" aria-label="${pi+1}쪽으로 이동" aria-current="${pi===cur}">${film(pi,'span')}<span class="mini"><span class="mini-inner" style="display:block"><span class="paper" style="display:block">${pageBody(pi,false)}</span></span></span></button>`).join('');
  $('#ov').hidden=false;document.body.classList.add('lock');
  const w=$('#ovGrid .mini')?.clientWidth||120;$('#ovGrid').style.setProperty('--ts',(w/620).toFixed(4));
  $(`#ovGrid .cell[data-goto="${cur}"]`)?.focus({preventScroll:true});
}
function closeOverview(){$('#ov').hidden=true;document.body.classList.remove('lock')}
$('#ovClose').onclick=closeOverview;
$('#ov').addEventListener('click',e=>{
  const c=e.target.closest('[data-goto]');
  if(c){closeOverview();go(+c.dataset.goto);return}
  if(e.target===$('#ov'))closeOverview();
});
addEventListener('resize',()=>{if(!$('#ov').hidden){const w=$('#ovGrid .mini')?.clientWidth||120;$('#ovGrid').style.setProperty('--ts',(w/620).toFixed(4))}});

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2800)}

/* 클릭 규칙: 글자 위가 아니어도 블록 안을 누르면, 누른 자리에서 가장 가까운 문장(줄)이 선택된다 */
const BLOCKS='.d-p,.d-ul li,.d-tbl td,.d-h,.d-h3,.d-title,.d-meta,.d-toc,.d-lines';
function hit(e){
  const direct=e.target.closest('#doc .u');if(direct)return direct;
  if(!e.target.closest('#doc')||e.target.closest('.ann'))return null;
  const blk=e.target.closest(BLOCKS);if(!blk)return null;
  let best=null,score=Infinity;
  for(const el of blk.querySelectorAll('.u'))for(const r of el.getClientRects()){
    const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom),sc=dy*1000+dx;
    if(sc<score){score=sc;best=el}
  }
  return best;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#ov'))return;
  if(e.target.closest('[data-ov]')){openOverview();return}
  const sm=e.target.closest('[data-sample]');if(sm){if(+sm.dataset.sample!==sampleN)load(+sm.dataset.sample);return}
  const x=e.target.closest('[data-x]');if(x){req.delete(x.dataset.x);render();return}
  const u=hit(e);
  if(u){const id=u.dataset.u;if(req.has(id)){req.delete(id);render()}else{req.set(id,{comment:''});render(id)}}
});
document.addEventListener('input',e=>{const c=e.target.dataset?.c;if(c&&req.has(c)){req.get(c).comment=e.target.value;e.target.classList.remove('need')}});
document.addEventListener('keydown',e=>{
  if(!$('#ov').hidden){if(e.key==='Escape')closeOverview();return}
  const t=e.target;
  if(t.matches&&t.matches('textarea[data-c]')){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){
      e.preventDefault();
      const here=[...t.closest('.paper').querySelectorAll('textarea[data-c]')];
      const empty=here.filter(x=>!x.value.trim());
      if(empty.length){empty.forEach(x=>x.classList.add('need'));empty[0].focus();toast(`주석이 비어 있는 요청이 ${empty.length}개 있어 보내지 않았습니다.`)}
      else toast(`화면 시안입니다. 이 쪽의 주석 ${here.length}개를 Claude에게 보내는 자리입니다.`);
    }
    return;
  }
  if(e.key==='ArrowRight'){e.preventDefault();go(cur+1)}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}
});
$('#export').onclick=()=>toast(req.size?`빨강 문장이 ${req.size}개 남아 있어 내보낼 수 없습니다.`:'화면 시안입니다. 내보내기는 다음 단계에서 연결합니다.');
$('#back').onclick=()=>toast('화면 시안입니다. 첫 화면으로 돌아가는 자리입니다.');
$('#docT').textContent=TITLE;
load(2);
</script>
